# Publica la demo estática (datos inventados, sin servidor ni NewHotel) en GitHub Pages.
# Requisito: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# En repos privados, GitHub Pages necesita un plan de pago (Pro, Team o Enterprise).
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *" # cada día: regenera la demo para que las fechas sean las de hoy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          HOTEL_TZ: America/Lima
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
